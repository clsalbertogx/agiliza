name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Vulnerability Scan
        continue-on-error: true
        run: npm audit

      - name: TypeCheck Backend
        working-directory: apps/backend
        run: npx tsc --noEmit

      - name: TypeCheck Frontend
        working-directory: apps/frontend
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint 2>/dev/null || echo "Lint script not configured"

  test:
    name: Test
    needs: lint-and-typecheck
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: agiliza
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/agiliza

      - name: Run Backend Tests
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/agiliza
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        run: npx vitest run --reporter=verbose

      - name: Run Frontend Tests
        working-directory: apps/frontend
        run: npx vitest run --reporter=verbose || echo "Frontend tests not configured yet"

  coverage:
    name: Coverage
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: agiliza
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/agiliza

      - name: Run Backend Coverage
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/agiliza
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
        run: npx vitest run --coverage

      - name: Run Frontend Coverage
        working-directory: apps/frontend
        run: npm run test:coverage

      - name: Upload Backend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-backend
          path: apps/backend/coverage/

      - name: Upload Frontend Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-frontend
          path: apps/frontend/coverage/

  e2e:
    name: E2E Tests
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dev
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: agiliza
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Apply database migrations
        working-directory: apps/backend
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/agiliza

      - name: Start Backend
        run: |
          cd apps/backend
          npx tsx src/index.ts &
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/agiliza
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          NODE_ENV: test

      - name: Wait for Health Endpoint
        run: |
          npx wait-on http://localhost:3333/api/health --timeout 30000 \
            || (echo "::error::Backend health check timed out after 30s — the server may have failed to start"; exit 1)

      - name: Run E2E Tests
        run: npx playwright test --config=e2e/playwright.config.ts
        env:
          DATABASE_URL: postgresql://dev:dev@localhost:5432/agiliza
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
          NODE_ENV: test
          API_URL: http://localhost:3333

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
