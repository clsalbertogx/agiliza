name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

# Prevent parallel deployments for the same tag/ref: a newer release must not
# overwrite the deployment of a still-running older one.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # Redis is required by the smoke test: the API registers @fastify/rate-limit
    # with a Redis store, and the plugin fails closed (throws 500) when Redis is
    # unreachable. The health endpoint stays DB-free, so no database is needed.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push Backend
        id: build-backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend
        id: build-frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ steps.version.outputs.VERSION }}
            ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test - run backend container
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend:${{ steps.version.outputs.VERSION }}
        run: |
          docker run -d --name agiliza-smoke-test \
            -e NODE_ENV=test \
            -e REDIS_URL=redis://localhost:6379 \
            -p 8080:3333 \
            "$BACKEND_IMAGE"
          # Always clean up the container, even on failure
          trap 'docker rm -f agiliza-smoke-test >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:8080/api/health; then
              echo "::notice::Smoke test passed - backend container is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Smoke test failed - backend container did not become healthy"
          docker logs agiliza-smoke-test
          exit 1

      - name: Output image digests
        run: |
          echo "Backend image digest: ${{ steps.build-backend.outputs.digest }}"
          echo "Frontend image digest: ${{ steps.build-frontend.outputs.digest }}"

